name: UI Build

on:
  push:
    paths:
      - 'VGamepadWeb.UI/**'
  pull_request:
    paths:
      - 'VGamepadWeb.UI/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VGamepadWeb.UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VGamepadWeb.UI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build